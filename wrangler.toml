name = "still-lift-zone"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PRIVATE_DEBUG_CACHE = "1"
# SUPER_ADMIN_EMAIL, SUPER_ADMIN_PASSWORD, SUPER_ADMIN_JWT_SECRET
# are set in Cloudflare Worker dashboard → Variables and Secrets (as Secrets).
# Do NOT commit them here — this file is in git.
